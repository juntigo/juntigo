<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#071b33">
  <title>Nie znaleziono strony — Juntigo</title>
  <style>
    :root{--navy:#071b33;--orange:#ff7417;--cream:#fffaf4}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--cream);color:var(--navy);font-family:Arial,Helvetica,sans-serif;text-align:center}
    main{max-width:620px}
    .logo{font-size:28px;font-weight:900;letter-spacing:-1.5px;margin-bottom:48px}
    .logo span{color:var(--orange)}
    .code{font-size:92px;line-height:1;font-weight:900;margin-bottom:18px}
    h1{font-size:34px;margin:0 0 12px}
    p{color:#667587;font-size:17px;line-height:1.6;margin:0 0 30px}
    a{display:inline-block;padding:14px 24px;border-radius:999px;background:var(--orange);color:#fff;text-decoration:none;font-weight:800}
    a:hover{background:var(--navy)}
  </style>
  <link rel="stylesheet" href="brand-refresh.css?v=1">
</head>
<body>
  <main>
    <a class="logo logo-image" href="/" aria-label="Juntigo — strona główna"><img src="juntigo-logo.png" alt="Juntigo"></a>
    <div class="code">404</div>
    <h1>Nie znaleziono strony</h1>
    <p>Wygląda na to, że ten adres nie prowadzi już do dostępnej strony.</p>
    <a href="/">Wróć na stronę główną</a>
  </main>
</body>
</html>
