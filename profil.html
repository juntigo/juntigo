<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profil — Juntigo</title>
  <meta name="description" content="Twój profil Juntigo.">

  <style>
    :root {
      --navy: #071b33;
      --navy-light: #0d2948;
      --orange: #ff7417;
      --cream: #fffaf4;
      --white: #ffffff;
      --text: #17283b;
      --muted: #667587;
      --border: #e7e1da;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--cream);
      line-height: 1.6;
    }

    nav {
      height: 100px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
    }

    .nav-inner {
      width: min(1400px, 92%);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      display: block;
    }

    .back-link {
      color: var(--navy);
      text-decoration: none;
      font-weight: 700;
      border: 2px solid var(--navy);
      padding: 12px 22px;
      border-radius: 999px;
      transition: all 0.25s ease;
    }

    .back-link:hover {
      background: var(--navy);
      color: white;
    }

    main {
      min-height: calc(100vh - 100px);
      padding: 80px 20px;
    }

    .profile-page {
      width: min(900px, 100%);
      margin: 0 auto;
    }

    .profile-header {
      margin-bottom: 40px;
    }

    .eyebrow {
      color: var(--orange);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      color: var(--navy);
      font-size: clamp(38px, 6vw, 56px);
      line-height: 1.05;
      letter-spacing: -2px;
      margin-bottom: 12px;
    }

    .intro {
      color: var(--muted);
      font-size: 18px;
      max-width: 650px;
    }

    .profile-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px;
      box-shadow: 0 12px 35px rgba(7, 27, 51, 0.08);
    }

    .profile-placeholder {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: var(--navy);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 24px;
    }

    .profile-card h2 {
      color: var(--navy);
      font-size: 28px;
      margin-bottom: 8px;
    }

    .profile-status {
      color: var(--orange);
      font-weight: 800;
      margin-bottom: 24px;
    }

    .profile-empty {
      padding: 24px;
      background: #f7f8fa;
      border-radius: 16px;
      color: var(--muted);
    }
.profile-form {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.profile-photo-section {
  display: flex;
  align-items: center;
  gap: 24px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border);
}

.profile-photo-section h2 {
  color: var(--navy);
  font-size: 28px;
  margin-bottom: 4px;
}

.profile-photo-section p {
  color: var(--muted);
  font-size: 15px;
}

.profile-form-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.profile-form-group label {
  color: var(--navy);
  font-size: 15px;
  font-weight: 800;
}

.profile-form-group input,
.profile-form-group textarea {
  width: 100%;
  border: 1px solid #d8dde3;
  border-radius: 12px;
  padding: 14px 16px;
  font: inherit;
  color: var(--text);
  background: white;
  outline: none;
}

.profile-form-group textarea {
  min-height: 120px;
  resize: vertical;
}

.profile-form-group input:focus,
.profile-form-group textarea:focus {
  border-color: var(--orange);
  box-shadow: 0 0 0 3px rgba(255, 116, 23, 0.10);
}

.profile-form-group small {
  color: var(--muted);
  font-size: 12px;
}

.profile-form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.profile-options {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.profile-options button {
  border: 1px solid #d8dde3;
  background: white;
  color: var(--navy);
  padding: 10px 14px;
  border-radius: 999px;
  font: inherit;
  font-size: 14px;
  cursor: pointer;
}

.profile-options button:hover {
  border-color: var(--orange);
  color: var(--orange);
}

.profile-trips {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.profile-trip-option {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border: 1px solid #d8dde3;
  border-radius: 12px;
  cursor: pointer;
}

.profile-trip-option input {
  width: 18px;
  height: 18px;
  accent-color: var(--orange);
}

.profile-trip-option span {
  color: var(--navy);
  font-size: 14px;
  font-weight: 700;
}

.profile-submit {
  width: 100%;
  min-height: 54px;
  border: 0;
  border-radius: 999px;
  background: var(--orange);
  color: white;
  font: inherit;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
}

.profile-submit:hover {
  background: var(--navy);
}

@media (max-width: 600px) {
  .profile-photo-section {
    align-items: flex-start;
  }

  .profile-photo-section h2 {
    font-size: 24px;
  }

  .profile-form-row {
    grid-template-columns: 1fr;
    gap: 24px;
  }
    @media (max-width: 600px) {
      nav {
        height: 76px;
      }

      .logo img {
        width: 54px;
        height: 54px;
      }

      .back-link {
        padding: 9px 14px;
        font-size: 13px;
      }

      main {
        min-height: calc(100vh - 76px);
        padding: 50px 16px;
      }

      .profile-card {
        padding: 24px;
        border-radius: 20px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="nav-inner">

      <a href="index.html" class="logo">
        <img src="juntigo-logo.png" alt="Juntigo">
      </a>

      <a href="index.html" class="back-link">
        Wróć do Juntigo
      </a>

    </div>
  </nav>

  <main>
    <div class="profile-page">

      <div class="profile-header">
        <div class="eyebrow">Juntigo</div>
        <h1>Twój profil</h1>
        <p class="intro">
          Stwórz swój profil, pokaż innym, kim jesteś i łatwiej znajdź osoby,
          z którymi naprawdę chcesz podróżować.
        </p>
      </div>

      <div class="profile-card">

  <div class="profile-form">

    <div class="profile-photo-section">
      <div class="profile-placeholder">J</div>

      <div>
        <h2>Stwórz swój profil</h2>
        <p>Dodaj kilka informacji, żeby inni mogli Cię lepiej poznać.</p>
      </div>
    </div>

    <div class="profile-form-group">
      <label for="profile-name">Imię lub pseudonim</label>
      <input type="text" id="profile-name" placeholder="np. Maks">
    </div>

    <div class="profile-form-row">

      <div class="profile-form-group">
        <label for="profile-age">Wiek</label>
        <input type="number" id="profile-age" placeholder="np. 25" min="18" max="100">
      </div>

      <div class="profile-form-group">
        <label for="profile-city">Miasto</label>
        <input type="text" id="profile-city" placeholder="np. Warszawa">
      </div>

    </div>

    <div class="profile-form-group">
      <label for="profile-instagram">Instagram</label>
      <input type="text" id="profile-instagram" placeholder="@twojprofil">
    </div>

    <div class="profile-form-group">
      <label for="profile-about">O mnie</label>
      <textarea
        id="profile-about"
        maxlength="300"
        placeholder="Napisz kilka zdań o sobie..."
      ></textarea>
      <small>Do 300 znaków</small>
    </div>

    <div class="profile-form-group">
      <label>Zainteresowania</label>

      <div class="profile-options">
        <button type="button">Podróże</button>
        <button type="button">Sport</button>
        <button type="button">Muzyka</button>
        <button type="button">Jedzenie</button>
        <button type="button">Imprezy</button>
        <button type="button">Fotografia</button>
        <button type="button">Zwiedzanie</button>
        <button type="button">Plaża</button>
        <button type="button">Góry</button>
        <button type="button">Piłka nożna</button>
        <button type="button">Festiwale</button>
        <button type="button">Kultura</button>
      </div>
    </div>

    <div class="profile-form-group">
      <label>Styl podróżowania</label>

      <div class="profile-options">
        <button type="button">Zwiedzanie</button>
        <button type="button">Relaks</button>
        <button type="button">Imprezy</button>
        <button type="button">Jedzenie i lokalny klimat</button>
        <button type="button">Sport</button>
        <button type="button">Fotografia</button>
        <button type="button">Aktywnie</button>
        <button type="button">Chill</button>
      </div>
    </div>

    <div class="profile-form-group">
      <label>Wyjazdy, które Cię interesują</label>

      <div class="profile-trips">
        <label class="profile-trip-option">
          <input type="checkbox" value="Mediolan">
          <span>Mediolan</span>
        </label>

        <label class="profile-trip-option">
          <input type="checkbox" value="Oktoberfest 2026">
          <span>Oktoberfest 2026</span>
        </label>

        <label class="profile-trip-option">
          <input type="checkbox" value="Malaga CF – Espanyol">
          <span>Málaga CF – Espanyol</span>
        </label>
      </div>
    </div>

    <button type="button" class="profile-submit">
      Zapisz profil
    </button>

  </div>

</div>

    </div>
  </main>

</body>
</html>
