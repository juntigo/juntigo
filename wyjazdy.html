/* PROPOSAL FORM MODAL */

#proposal-modal {
    position: fixed;
    inset: 0;
    z-index: 100001;
}

.proposal-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-y: auto;
    background: rgba(7, 27, 51, 0.72);
}

.proposal-modal-box {
    position: relative;
    width: 100%;
    max-width: 620px;
    max-height: calc(100vh - 48px);
    overflow-y: auto;
    padding: 36px;
    border-radius: 24px;
    background: var(--white);
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.25);
}

.proposal-close {
    position: absolute;
    top: 16px;
    right: 18px;
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 50%;
    background: #f1f3f5;
    color: var(--navy);
    font-size: 26px;
    line-height: 1;
    cursor: pointer;
}

.proposal-close:hover {
    background: var(--navy);
    color: var(--white);
}

.proposal-modal-tag {
    margin-bottom: 8px;
    color: var(--orange);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2px;
}

.proposal-modal-box h2 {
    margin: 0 0 8px;
    color: var(--navy);
    font-size: 32px;
}

.proposal-description {
    margin: 0 0 24px;
    color: var(--muted);
    line-height: 1.6;
}

.proposal-form {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.proposal-form-section {
    padding: 20px;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    background: #f8fafc;
}

.proposal-form-section-title {
    margin-bottom: 18px;
    color: var(--navy);
    font-size: 15px;
    font-weight: 800;
}

.proposal-form label {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
    color: var(--navy);
    font-size: 14px;
    font-weight: 700;
}

.proposal-form label:last-child {
    margin-bottom: 0;
}

.proposal-form input,
.proposal-form select,
.proposal-form textarea {
    width: 100%;
    min-height: 48px;
    padding: 14px 16px;
    border: 1px solid #d7dee8;
    border-radius: 12px;
    outline: none;
    background: var(--white);
    color: var(--navy);
    font: inherit;
    font-size: 15px;
}

.proposal-form textarea {
    min-height: 120px;
    resize: vertical;
}

.proposal-form input:focus,
.proposal-form select:focus,
.proposal-form textarea:focus {
    border-color: var(--orange);
    box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.12);
}

.proposal-form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.proposal-status {
    display: none;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
}

.proposal-status.is-visible {
    display: block;
}

.proposal-status--error {
    border: 1px solid #f3c2c2;
    background: #fff1f1;
    color: #9f1d1d;
}

.proposal-success {
    padding: 8px 0;
    text-align: center;
}

.proposal-success h2 {
    margin-bottom: 12px;
}

.proposal-success p {
    margin-bottom: 24px;
    color: var(--muted);
}

.proposal-submit,
.proposal-done,
.proposal-trigger,
.proposal-nav-trigger {
    font: inherit;
    cursor: pointer;
}

.proposal-submit,
.proposal-done {
    width: 100%;
    min-height: 54px;
    border: 0;
    border-radius: 999px;
    background: var(--orange);
    color: var(--white);
    font-size: 16px;
    font-weight: 800;
}

.proposal-submit:hover,
.proposal-done:hover {
    background: var(--navy);
}

.proposal-submit:disabled {
    cursor: wait;
    opacity: 0.7;
}

.proposal-trigger {
    border: 0;
}

.proposal-nav-trigger {
    padding: 0;
    border: 0;
    background: transparent;
}

@media (max-width: 600px) {
    .proposal-overlay {
        padding: 12px;
    }

    .proposal-modal-box {
        max-height: calc(100vh - 24px);
        padding: 28px 20px;
        border-radius: 20px;
    }

    .proposal-modal-box h2 {
        font-size: 26px;
    }

    .proposal-form-section {
        padding: 16px;
    }

    .proposal-form-row {
        grid-template-columns: 1fr;
        gap: 0;
    }

    .proposal-form input,
    .proposal-form select,
    .proposal-form textarea {
        font-size: 16px;
    }
}

   document.getElementById("join-form").addEventListener("submit", async function(event) {
    event.preventDefault();

    const form = event.currentTarget;
    const submitButton = form.querySelector(".join-submit");
    const status = form.querySelector("#join-status");

    const ageValue = Number(document.getElementById("join-age").value.trim());

    if (!Number.isInteger(ageValue) || ageValue < 16 || ageValue > 99) {
        status.textContent = "Wiek musi wynosić od 16 do 99 lat.";
        status.className = "join-status join-status--error is-visible";
        document.getElementById("join-age").focus();
        return;
    }

    const name = document.getElementById("join-name").value.trim();
    const instagram = document.getElementById("join-instagram").value.trim();
    const email = document.getElementById("join-email").value.trim();
    const city = document.getElementById("join-city").value.trim();
    const about = document.getElementById("join-about").value.trim();

    const fieldLimits = [
        [trip, 150, "Wyjazd"],
        [name, 100, "Imię lub pseudonim"],
        [instagram, 100, "Instagram"],
        [email, 254, "E-mail"],
        [city, 100, "Miasto"],
        [about, 2000, "Opis"]
    ];

    const tooLong = fieldLimits.find(([value, limit]) => value.length > limit);

    if (tooLong) {
        status.textContent = tooLong[2] + " jest za długie.";
        status.className = "join-status join-status--error is-visible";
        return;
    }

    const formData = new URLSearchParams();

    formData.append("type", "join");
    formData.append("trip", trip);
    formData.append("name", name);
    formData.append("instagram", instagram);
    formData.append("email", email);
    formData.append("age", ageValue);
    formData.append("city", city);
    formData.append("about", about);
formData.append(
    "showProfile",
    document.getElementById("join-show-profile").checked ? "Tak" : "Nie"
);
    status.textContent = "";
    status.className = "join-status";
    submitButton.disabled = true;
    submitButton.textContent = "Wysyłamy...";
    try {
        const response = await fetch(JUNTIGO_API, {
            method: "POST",
            body: formData
        });

        const data = await response.json();

       if (data.success) {
    showJoinSuccess(trip);
} else {
    console.error(data.error);
    status.textContent = "Nie udało się wysłać zgłoszenia. Spróbuj ponownie za chwilę.";
    status.className = "join-status join-status--error is-visible";
    submitButton.disabled = false;
    submitButton.textContent = "Zgłoś zainteresowanie";
}

    } catch (error) {
        console.error(error);
        status.textContent = "Wystąpił błąd podczas wysyłania zgłoszenia. Spróbuj ponownie za chwilę.";
        status.className = "join-status join-status--error is-visible";
        submitButton.disabled = false;
        submitButton.textContent = "Zgłoś zainteresowanie";
    }
});
}

function closeJoinForm() {

    if (modal) {

    }

    document.body.style.overflow = "";
}
function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function getInstagramUrl(value) {
  const handle = String(value || "").trim().replace(/^@+/, "");

  if (!/^[A-Za-z0-9._]{1,100}$/.test(handle)) {
    return "";
  }

  return "https://www.instagram.com/" + encodeURIComponent(handle) + "/";
}
  
async function saveInterest(event, trip, toUserId, toName) {
    if (event) event.preventDefault();

    const contactButton =
        event && event.currentTarget ? event.currentTarget : null;

    const sessionToken = getJuntigoSessionToken();

    if (!sessionToken) {
        window.location.href = "konto.html";
        return;
    }

    const normalizedTrip = String(trip || "").trim();
    const normalizedUserId = String(toUserId || "").trim();

    if (!normalizedTrip || !normalizedUserId) {
        console.error("Brak danych zainteresowania.", {
            trip: normalizedTrip,
            toUserId: normalizedUserId
        });
        return;
    }

    if (contactButton) {
        contactButton.disabled = true;
        contactButton.textContent = "Wysyłamy...";
    }

    try {
        const response = await fetch(JUNTIGO_API, {
            method: "POST",
            body: new URLSearchParams({
                type: "interest",
                sessionToken: sessionToken,
                trip: normalizedTrip,
                toUserId: normalizedUserId
            })
        });

        const data = await response.json();

        if (!data.success) {
            const errorMessage =
                data.error || "Nie udało się wysłać zainteresowania.";

            if (/sesj|zalog|token|uwierzyteln/i.test(errorMessage)) {
                clearJuntigoSession();
                window.location.href = "konto.html";
                return;
            }

            throw new Error(errorMessage);
        }

        if (contactButton) {
            contactButton.textContent = "Zainteresowanie wysłane";
            contactButton.classList.add("interest-sent");
        }
    } catch (error) {
        console.error("Błąd wysyłania zainteresowania:", error);

        if (contactButton) {
            contactButton.textContent = "Jestem zainteresowany";
            contactButton.disabled = false;
        }

        if (/sesj|zalog|token|uwierzyteln/i.test(error.message || "")) {
            clearJuntigoSession();
            window.location.href = "konto.html";
        }
    }
}

    const box = modal.querySelector(".join-modal-box");

    if (!box) {
        return;
    }

    box.innerHTML = `

            JUNTIGO

        Jeśli zainteresowanie będzie wzajemne, połączymy Was.

        <strong>Chcesz pokazać innym więcej o sobie?</strong>
        <span>
            Utwórz profil Juntigo, dodaj zdjęcie, zainteresowania i kilka informacji o sobie.

    </div>

        type="button"

        Utwórz profil
    </button>

            <button
                type="button"
                class="join-submit"
                onclick="closeJoinForm()"
            >
                Gotowe
            </button>

    `;
}

{name:"Turcja",code:"tr",flag:"🇹🇷",items:[["ANTALYA","Antalya","🏙️"],["IZMIR","Izmir","🏙️"]]},
{name:"Węgry",code:"hu",flag:"🇭🇺",items:[["BUDAPESZT","Budapeszt","🏙️"]]},
{name:"Włochy",code:"it",flag:"🇮🇹",items:[["RZYM","Rzym","🏙️"],["BARI","Bari","🏙️"],["PESCARA","Pescara","🏙️"],["REGGIO_DI_CALABRIA","Reggio di Calabria","🏙️"],["OLBIA_SARDYNIA","Olbia – Sardynia","🏝️"],["PERUGIA","Perugia","🏙️"],["LAMEZIA_TERME","Lamezia Terme","🏙️"],["ANKONA","Ankona","🏙️"],["GENUA","Genua","🏙️"],["ALGHERO_SARDYNIA","Alghero – Sardynia","🏝️"],["RIMINI","Rimini","🏙️"],["NEAPOL","Neapol","🏙️"],["CAGLIARI_SARDYNIA","Cagliari – Sardynia","🏝️"],["PIZA","Piza","🏙️"],["FLORENCJA","Florencja","🏙️"],["BOLONIA","Bolonia","🏙️"],["PALERMO_SYCYLIA","Palermo – Sycylia","🏝️"],["KATANIA_SYCYLIA","Katania – Sycylia","🏝️"],["TRAPANI_SYCYLIA","Trapani – Sycylia","🏝️"],["MEDIOLAN","Mediolan","🏙️"],["WENECJA","Wenecja","🏙️"],["BRINDISI","Brindisi","🏙️"],["TURYN","Turyn","🏙️"],["TRIEST","Triest","🏙️"]]}
];

const EVENT_TRIPS=[];

const EVENTS=[
["EVENT_WARSAW_BEER_2026","Warszawski Festiwal Piwa","Warszawa","Polska","pl","🍺","2026-10-15","15–17 października 2026"],
["EVENT_KRAKOW_CONRAD_2026","Festiwal Conrada","Kraków","Polska","pl","📚","2026-10-19","19–25 października 2026"],
["EVENT_WROCLAW_ONELOVE_2026","One Love Wrocław Music Festival","Wrocław","Polska","pl","🎵","2026-11-21","21 listopada 2026"],
["EVENT_GDANSK_WITCHER_2026","WIEDŹMIN. Muzyka Kontynentu","Gdańsk","Polska","pl","🎻","2026-11-05","5 listopada 2026"],
["EVENT_PRAGUE_SIGNAL_2026","Signal Festival","Praga","Czechy","cz","💡","2026-10-15","15–18 października 2026"],
["EVENT_VIENNA_VIENNALE_2026","Viennale — Vienna International Film Festival","Wiedeń","Austria","at","🎬","2026-10-22","22 października – 3 listopada 2026"],
["EVENT_BERLIN_LIGHTS_2026","Festival of Lights","Berlin","Niemcy","de","✨","2026-10-09","9–18 października 2026"],
["EVENT_AMSTERDAM_ADE_2026","Amsterdam Dance Event","Amsterdam","Holandia","nl","🎧","2026-10-21","21–25 października 2026"],
["EVENT_BARCELONA_INEDIT_2026","IN-EDIT Barcelona","Barcelona","Hiszpania","es","🎞️","2026-10-29","29 października – 8 listopada 2026"],
["EVENT_MADRID_JAZZ_2026","JAZZMADRID26","Madryt","Hiszpania","es","🎷","2026-10-02","2 października – 30 listopada 2026"],
["EVENT_PARIS_GAMES_2026","Paris Games Week","Paryż","Francja","fr","🎮","2026-10-22","22–25 października 2026"],
["EVENT_MILAN_JAZZMI_2026","JazzMi 2026","Mediolan","Włochy","it","🎷","2026-10-19","19 października – 8 listopada 2026"],
["EVENT_LISBON_DOCLISBOA_2026","Doclisboa","Lizbona","Portugalia","pt","🎬","2026-10-15","15–25 października 2026"],
["EVENT_LONDON_JAZZ_2026","EFG London Jazz Festival","Londyn","Anglia","gb-eng","🎷","2026-11-13","13–22 listopada 2026"],
["EVENT_LONDON_LORD_MAYOR_2026","Lord Mayor Show","Londyn","Anglia","gb-eng","🎭","2026-11-14","14 listopada 2026"],
["EVENT_PARIS_ORELSAN_2026","Orelsan — koncert","Paryż","Francja","fr","🎤","2026-12-09","9–20 grudnia 2026"],
["EVENT_MADRID_HOMENS_G_2026","Hombres G — koncert","Madryt","Hiszpania","es","🎤","2026-12-11","11–12 grudnia 2026"],
["EVENT_LISBON_TRIBECA_2026","Tribeca Festival Lisboa","Lizbona","Portugalia","pt","🎬","2026-12-09","9–13 grudnia 2026"],
["EVENT_AMSTERDAM_LIGHT_2026","Amsterdam Light Festival","Amsterdam","Holandia","nl","✨","2026-11-26","26 listopada – 31 grudnia 2026"]
].map(x=>({tripId:x[0],destination:x[1],city:x[2],country:x[3],countryCode:x[4],icon:x[5],type:"event",direction:x[4]==="pl"?"poland":"abroad",dateStart:x[6],dateLabel:x[7]}));

const CITY_TRIPS=COUNTRIES.flatMap(country=>country.items.map(item=>({
tripId:"CITY_"+item[0],destination:item[1],icon:item[2],variant:item[3]||"",country:country.name,countryCode:country.code,type:"city",direction:country.code==="pl"?"poland":"abroad"
})));

const monthFilter=document.getElementById("monthFilter");
const typeFilter=document.getElementById("typeFilter");
const directionFilter=document.getElementById("directionFilter");
const resultCount=document.getElementById("resultCount");
const activeFilters=document.getElementById("activeFilters");
const cityBreakView=document.getElementById("cityBreakView");
const allView=document.getElementById("allView");

function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]));}
function flagUrl(code){return "https://flagcdn.com/w80/"+code+".png";}
function flagImg(code,alt){return '<img class="country-flag-img" src="'+flagUrl(code)+'" alt="'+escapeHtml(alt||"Flaga")+'" loading="lazy">';}

function filteredTrips(){
const type=typeFilter.value,direction=directionFilter.value,month=monthFilter.value;
const source=type==="event"?EVENTS:(type==="city"?CITY_TRIPS:(month!=="all"?EVENTS:[...CITY_TRIPS,...EVENTS]));
return source.filter(t=>(type==="all"||t.type===type)&&(direction==="all"||t.direction===direction)&&(!month||month==="all"||t.type!=="event"||t.dateStart.slice(0,7)===month));
}

function cityCard(t){
const card=document.createElement("article");card.className="city-card";
const variantText=t.variant?'<div class="city-variant">'+escapeHtml(t.variant)+'</div>':"";
card.innerHTML='<div class="city-icon" aria-hidden="true">'+t.icon+'</div><div class="city-content"><div class="city-meta"><span class="badge orange">✈️ Wycieczka</span></div><h3>'+escapeHtml(t.destination)+'</h3>'+variantText+'<p>Wyjazd nastawiony na poznawanie kierunku, zwiedzanie i wspólne odkrywanie miasta lub regionu.</p><div class="city-actions"><button type="button" class="trip-team-action" data-trip="'+escapeHtml(t.tripId)+'">Zobacz ekipę</button><button type="button" class="trip-action" data-join-trip="'+escapeHtml(t.tripId)+'">Jestem zainteresowany</button></div></div>';
return card;
}

function renderCountryGroups(trips){
cityBreakView.replaceChildren();
if(!trips.length){cityBreakView.innerHTML='<div class="empty"><strong>Brak wyjazdów.</strong>Spróbuj zmienić filtry.</div>';return;}
const groups=new Map();
trips.forEach(t=>{if(!groups.has(t.country))groups.set(t.country,{country:t.country,code:t.countryCode,trips:[]});groups.get(t.country).trips.push(t);});
[...groups.values()].sort((a,b)=>a.country.localeCompare(b.country,"pl")).forEach((group,index)=>{
const details=document.createElement("details");details.className="country-section";if(index===0)details.open=true;
const summary=document.createElement("summary");summary.innerHTML='<span class="country-title">'+flagImg(group.code,group.country)+'<span>'+escapeHtml(group.country)+'</span></span><span class="country-count">'+group.trips.length+' '+(group.trips.length===1?"kierunek":group.trips.length<5?"kierunki":"kierunków")+' <span class="country-chevron">⌄</span></span>';
details.appendChild(summary);
const grid=document.createElement("div");grid.className="city-grid";group.trips.forEach(t=>grid.appendChild(cityCard(t)));
details.appendChild(grid);cityBreakView.appendChild(details);
});
}

function renderAllTrips(trips){
allView.replaceChildren();
if(!trips.length){allView.innerHTML='<div class="empty"><strong>Brak wyjazdów.</strong>Spróbuj zmienić filtry.</div>';return;}
const grid=document.createElement("div");grid.className="trip-grid";
trips.forEach(t=>{
const c=document.createElement("article");c.className="trip-card";
c.innerHTML='<div class="trip-visual" aria-hidden="true">'+t.icon+'</div><div class="trip-content"><div class="trip-meta"><span class="badge orange">'+TYPE_LABELS[t.type]+'</span><span class="badge">'+escapeHtml(t.city||t.country)+'</span></div><h3>'+escapeHtml(t.destination)+'</h3><div class="country-line">'+flagImg(t.countryCode,t.country)+'<span>'+escapeHtml(t.country)+'</span></div>'+(t.type==="event"&&t.dateLabel?'<div class="trip-event-date"><span class="event-calendar-icon" aria-hidden="true">📅</span><span>'+escapeHtml(t.dateLabel)+'</span></div>':'')+'<p class="trip-description">'+(t.type==="event"?"Wydarzenie, dla którego warto zaplanować osobny wyjazd.":"Wyjazd nastawiony na poznawanie kierunku, zwiedzanie i wspólne odkrywanie miasta lub regionu.")+'</p><div class="trip-actions"><button type="button" class="trip-team-action" data-trip="'+escapeHtml(t.tripId)+'">Zobacz ekipę</button><button type="button" class="trip-action" data-join-trip="'+escapeHtml(t.tripId)+'">Jestem zainteresowany</button></div></div>';
grid.appendChild(c);
});
allView.appendChild(grid);
}

function render(){
const trips=filteredTrips();
resultCount.textContent=trips.length+" "+(trips.length===1?"wyjazd":trips.length<5?"wyjazdy":"wyjazdów");
activeFilters.replaceChildren();
[[monthFilter,"month"],[typeFilter,"type"],[directionFilter,"direction"]].forEach(([select])=>{
if(select.value==="all")return;
const chip=document.createElement("span");chip.className="filter-chip";chip.innerHTML=escapeHtml(select.options[select.selectedIndex].textContent)+' <button type="button" aria-label="Usuń filtr">×</button>';
chip.querySelector("button").onclick=()=>{select.value="all";render()};activeFilters.appendChild(chip);
});
const clear=document.createElement("button");clear.type="button";clear.className="clear-filters";clear.textContent="Wyczyść filtry";clear.onclick=()=>{monthFilter.value="all";typeFilter.value="all";directionFilter.value="all";render()};activeFilters.appendChild(clear);
const cityMode=typeFilter.value==="city";
cityBreakView.classList.toggle("hidden",!cityMode);
allView.classList.toggle("hidden",cityMode);
if(cityMode)renderCountryGroups(trips);else renderAllTrips(trips);
}

[monthFilter,typeFilter,directionFilter].forEach(el=>el.addEventListener("change",render));
document.querySelectorAll(".view-switch button").forEach(btn=>btn.addEventListener("click",()=>{
document.querySelectorAll(".view-switch button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");
const all=btn.dataset.view==="all";
cityBreakView.classList.toggle("hidden",all);allView.classList.toggle("hidden",!all);
if(all)renderAllTrips(filteredTrips());else renderCountryGroups(filteredTrips());
}));

document.addEventListener("click",event=>{const teamButton=event.target.closest(".trip-team-action");if(teamButton)loadTripTeam(teamButton);});

async function loadTripTeam(button){
const trip=button.dataset.trip,card=button.closest(".city-card,.trip-card");if(!card)return;
let box=card.querySelector(".team-results");
if(box){box.remove();button.textContent="Zobacz ekipę";return;}
box=document.createElement("div");box.className="team-results";box.innerHTML='<div class="team-empty">Szukamy ekipy...</div>';
(card.querySelector(".city-content")||card.querySelector(".trip-content")).appendChild(box);button.textContent="Ukryj ekipę";
try{
const session=await validateJuntigoSession();const token=session.authenticated?getJuntigoSessionToken():"";
const response=await fetch(JUNTIGO_API+"?trip="+encodeURIComponent(trip)+(token?"&sessionToken="+encodeURIComponent(token):""));const data=await response.json();
if(!data.success){box.innerHTML='<div class="team-empty">Nie udało się pobrać ekipy.</div>';return;}
if(!Array.isArray(data.people)||!data.people.length){box.innerHTML='<div class="team-empty"><strong>Na razie nikogo tu nie ma.</strong><br>Bądź pierwszą osobą zainteresowaną tym kierunkiem.</div>';return;}
box.innerHTML='<div class="team-heading"><strong>Osoby zainteresowane</strong><span>'+data.count+'</span></div>'+data.people.slice(0,6).map(p=>'<div class="person-mini"><div><strong>'+escapeHtml(p.name||"Użytkownik")+'</strong><span>'+(p.age?escapeHtml(p.age+" lat"):"")+(p.city?" · "+escapeHtml(p.city):"")+'</span></div></div>').join("");
}catch(error){console.error(error);box.innerHTML='<div class="team-empty">Wystąpił błąd podczas pobierania ekipy.</div>';}
}

render();</script>
</body>
