{id:"dresden-market-2026",tripId:"DRESDEN_MARKET_2026",year:2026,month:11,type:"market",direction:"abroad",destination:"Drezno",title:"Striezelmarkt",date:"25 listopada – 24 grudnia 2026",description:"Jeden z najstarszych i najbardziej charakterystycznych jarmarków w Niemczech.",icon:"🎄"},

{id:"lech-pogon-2026",tripId:"LECH_POGON_2026",year:2026,month:11,type:"sport",direction:"poland",destination:"Poznań",title:"Lech Poznań – Pogoń Szczecin",date:"28 listopada 2026",description:"Mecz Ekstraklasy na stadionie Lecha.",icon:"⚽"},
{id:"liverpool-mu-2026",tripId:"LIVERPOOL_MAN_UTD_2026",year:2026,month:11,type:"sport",direction:"abroad",destination:"Liverpool",title:"Liverpool – Manchester United",date:"22 listopada 2026",description:"Premier League — klasyk angielskiego futbolu.",icon:"⚽"},
{id:"arsenal-city-2026",tripId:"ARSENAL_MAN_CITY_2026",year:2026,month:11,type:"sport",direction:"abroad",destination:"Londyn",title:"Arsenal – Manchester City",date:"29 listopada 2026",description:"Premier League na Emirates Stadium.",icon:"⚽"},
{id:"barca-celta-2026",tripId:"BARCA_CELTA_2026",year:2026,month:12,type:"sport",direction:"abroad",destination:"Barcelona",title:"FC Barcelona – Celta Vigo",date:"6 grudnia 2026",description:"LaLiga na Spotify Camp Nou.",icon:"⚽"},
{id:"barca-city-2026",tripId:"BARCA_MAN_CITY_2026",year:2026,month:12,type:"sport",direction:"abroad",destination:"Barcelona",title:"FC Barcelona – Manchester City",date:"8 grudnia 2026",description:"Mecz fazy ligowej Ligi Mistrzów na Spotify Camp Nou.",icon:"⚽"},
{id:"gks-legia-2026",tripId:"GKS_LEGIA_2026",year:2026,month:12,type:"sport",direction:"poland",destination:"Katowice",title:"GKS Katowice – Legia Warszawa",date:"5 grudnia 2026",description:"Mecz Ekstraklasy w Katowicach.",icon:"⚽"},
{id:"legia-pogon-2026",tripId:"LEGIA_POGON_2026",year:2026,month:12,type:"sport",direction:"poland",destination:"Warszawa",title:"Legia Warszawa – Pogoń Szczecin",date:"12 grudnia 2026",description:"Mecz Ekstraklasy w Warszawie.",icon:"⚽"},
{id:"gdansk-market-dec-2026",tripId:"GDANSK_MARKET_2026",year:2026,month:12,type:"market",direction:"poland",destination:"Gdańsk",title:"Gdańsk — jarmark w grudniu",date:"1–23 grudnia 2026",description:"Grudniowy termin na świąteczny city break nad Bałtykiem.",icon:"🎄"},
{id:"wroclaw-market-dec-2026",tripId:"WROCLAW_MARKET_2026",year:2026,month:12,type:"market",direction:"poland",destination:"Wrocław",title:"Wrocław — jarmark w grudniu",date:"1–23 grudnia 2026",description:"Świąteczny weekend we Wrocławiu.",icon:"🎄"},
{id:"krakow-market-dec-2026",tripId:"KRAKOW_MARKET_2026",year:2026,month:12,type:"market",direction:"poland",destination:"Kraków",title:"Kraków — jarmark w grudniu",date:"1–31 grudnia 2026",description:"Świąteczny Kraków i Rynek Główny.",icon:"🎄"},
{id:"vienna-market-dec-2026",tripId:"VIENNA_MARKET_2026",year:2026,month:12,type:"market",direction:"abroad",destination:"Wiedeń",title:"Wiedeń — świąteczny city break",date:"1–26 grudnia 2026",description:"Jarmarki, iluminacje i centrum Wiednia.",icon:"🎄"},
{id:"prague-market-dec-2026",tripId:"PRAGUE_MARKET_2026",year:2026,month:12,type:"market",direction:"abroad",destination:"Praga",title:"Praga — świąteczny city break",date:"1–31 grudnia 2026",description:"Stare Miasto i świąteczna atmosfera czeskiej stolicy.",icon:"🎄"},
{id:"zagreb-advent-dec-2026",tripId:"ZAGREB_ADVENT_2026",year:2026,month:12,type:"market",direction:"abroad",destination:"Zagrzeb",title:"Zagrzeb — Advent",date:"1–31 grudnia 2026",description:"Adwentowe atrakcje w centrum Zagrzebia.",icon:"✨"}
];

const MONTHS=[
[2026,11,"Listopad 2026"],[2026,12,"Grudzień 2026"],
[2027,1,"Styczeń 2027"],[2027,2,"Luty 2027"],[2027,3,"Marzec 2027"],[2027,4,"Kwiecień 2027"],[2027,5,"Maj 2027"],[2027,6,"Czerwiec 2027"],[2027,7,"Lipiec 2027"],[2027,8,"Sierpień 2027"],[2027,9,"Wrzesień 2027"],[2027,10,"Październik 2027"],[2027,11,"Listopad 2027"],[2027,12,"Grudzień 2027"]
];

const monthFilter=document.getElementById("monthFilter");
const typeFilter=document.getElementById("typeFilter");
const directionFilter=document.getElementById("directionFilter");
const resultCount=document.getElementById("resultCount");
const activeFilters=document.getElementById("activeFilters");
const calendarView=document.getElementById("calendarView");
const allView=document.getElementById("allView");

MONTHS.forEach(([y,m,label])=>{const o=document.createElement("option");o.value=y+"-"+m;o.textContent=label;monthFilter.appendChild(o)});
Object.entries(TYPE_LABELS).forEach(([key,label])=>{const o=document.createElement("option");o.value=key;o.textContent=label;typeFilter.appendChild(o)});

function filteredTrips(){
 const month=monthFilter.value,type=typeFilter.value,direction=directionFilter.value;
 return TRIPS.filter(t=>(month==="all"||month===t.year+"-"+t.month)&&(type==="all"||type===t.type)&&(direction==="all"||direction===t.direction));
}
function card(t){
 const c=document.createElement("article");
 c.className="trip-card "+(t.direction==="poland"?"poland ":"")+(t.type==="sport"?"sport":"");
 c.innerHTML='<div class="trip-visual" aria-hidden="true">'+t.icon+'</div><div class="trip-content"><div class="trip-meta"><span class="badge orange">'+TYPE_LABELS[t.type]+'</span><span class="badge">'+(t.direction==="poland"?"🇵🇱 Polska":"🌍 Zagranica")+'</span></div><h3>'+escapeHtml(t.title)+'</h3><div class="trip-location">'+escapeHtml(t.destination)+'</div><p class="trip-description">'+escapeHtml(t.description)+'</p><div class="trip-date">'+escapeHtml(t.date)+'</div><a class="trip-action" href="profil.html?trip='+encodeURIComponent(t.tripId||t.id)+'">Wybieram ten wyjazd</a></div>';
 return c;
}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]))}
function render(){
 const trips=filteredTrips();
 activeFilters.replaceChildren();
 const labels=[];
 if(monthFilter.value!=="all"){
   const option=monthFilter.options[monthFilter.selectedIndex];
   labels.push({key:"month",label:option.textContent,select:monthFilter});
 }
 if(typeFilter.value!=="all"){
   const option=typeFilter.options[typeFilter.selectedIndex];
   labels.push({key:"type",label:option.textContent,select:typeFilter});
 }
 if(directionFilter.value!=="all"){
   const option=directionFilter.options[directionFilter.selectedIndex];
   labels.push({key:"direction",label:option.textContent,select:directionFilter});
 }
 labels.forEach(item=>{
   const chip=document.createElement("span");
   chip.className="filter-chip";
   chip.innerHTML=escapeHtml(item.label)+' <button type="button" aria-label="Usuń filtr '+escapeHtml(item.label)+'">×</button>';
   chip.querySelector("button").addEventListener("click",()=>{item.select.value="all";render();});
   activeFilters.appendChild(chip);
 });
 if(labels.length){
   const clear=document.createElement("button");
   clear.type="button";clear.className="clear-filters";clear.textContent="Wyczyść filtry";
   clear.addEventListener("click",()=>{monthFilter.value="all";typeFilter.value="all";directionFilter.value="all";render();});
   activeFilters.appendChild(clear);
 }
 resultCount.textContent=trips.length+" "+(trips.length===1?"wyjazd":(trips.length<5?"wyjazdy":"wyjazdów"));
 calendarView.replaceChildren();allView.replaceChildren();
 const grouped=new Map();
 MONTHS.forEach(([y,m,label])=>grouped.set(y+"-"+m,{year:y,month:m,label,trips:[]}));
 trips.forEach(t=>{const key=t.year+"-"+t.month;if(!grouped.has(key))grouped.set(key,{year:t.year,month:t.month,label:key,trips:[]});grouped.get(key).trips.push(t)});
 for(const group of grouped.values()){
   if(!group.trips.length) continue;
   const section=document.createElement("section");section.className="month-section";
   section.innerHTML='<div class="month-heading"><h2>'+group.label+'</h2><span>'+group.trips.length+' '+(group.trips.length===1?"wyjazd":group.trips.length<5?"wyjazdy":"wyjazdów")+'</span></div>';
   const grid=document.createElement("div");grid.className="trip-grid";group.trips.forEach(t=>grid.appendChild(card(t)));section.appendChild(grid);calendarView.appendChild(section);
 }
 if(!calendarView.children.length){
   calendarView.innerHTML='<div class="empty"><strong>Nie znaleźliśmy jeszcze wyjazdów spełniających te kryteria.</strong>Spróbuj zmienić filtry.</div>';
 }
 if(trips.length){
   const grid=document.createElement("div");grid.className="trip-grid";trips.forEach(t=>grid.appendChild(card(t)));allView.appendChild(grid);
 }else{
   allView.innerHTML='<div class="empty"><strong>Nie znaleźliśmy jeszcze wyjazdów spełniających te kryteria.</strong>Spróbuj zmienić filtry.</div>';
 }
}
document.querySelectorAll(".view-switch button").forEach(btn=>btn.addEventListener("click",()=>{
 document.querySelectorAll(".view-switch button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");
 const isCalendar=btn.dataset.view==="calendar";calendarView.classList.toggle("hidden",!isCalendar);allView.classList.toggle("hidden",isCalendar);
}));
[monthFilter,typeFilter,directionFilter].forEach(el=>el.addEventListener("change",render));
render();

async function sendTripInterest(button, trip, toUserId, personName){
  button.disabled=true;
  button.textContent="Zapisywanie...";
  try{
    const session=await validateJuntigoSession();
    if(!session.authenticated){
      window.location.href="konto.html";
      return;
    }
    const body=new URLSearchParams();
    body.append("type","interest");
    body.append("sessionToken",getJuntigoSessionToken());
    body.append("trip",trip);
    body.append("toUserId",toUserId);
    const response=await fetch(JUNTIGO_API,{method:"POST",body});
    const data=await response.json();
    if(!data.success){
      if(data.sessionInvalid){
        clearJuntigoSession();
        window.location.href="konto.html";
        return;
      }
      button.disabled=false;
      button.textContent=data.error||"Spróbuj ponownie";
      return;
    }
    if(data.match===true){
      button.classList.add("is-match");
      button.textContent="Match";
      button.disabled=true;
      setTimeout(()=>{window.location.href="konto.html";},900);
      return;
    }
    button.classList.add("is-sent");
    button.textContent="Zainteresowanie wysłane";
    button.disabled=true;
  }catch(error){
    console.error("Błąd zainteresowania:",error);
    button.disabled=false;
    button.textContent="Spróbuj ponownie";
  }
}

async function loadTripTeam(button){
  const trip=button.dataset.trip;
  const card=button.closest(".trip-card");
  let box=card.querySelector(".team-results");
  if(box){box.remove();button.textContent="Zobacz ekipę";return;}
  box=document.createElement("div");
  box.className="team-results";
  box.innerHTML="<div class=\"team-empty\">Szukamy ekipy...</div>";
  card.querySelector(".trip-content").appendChild(box);
  button.textContent="Ukryj ekipę";
  try{
    const session=await validateJuntigoSession();
    const token=session.authenticated?getJuntigoSessionToken():"";
    const url=JUNTIGO_API+"?trip="+encodeURIComponent(trip)+(token?"&sessionToken="+encodeURIComponent(token):"");
    const response=await fetch(url);
    const data=await response.json();
    if(!data.success){
      if(data.sessionInvalid){
        clearJuntigoSession();
        window.location.href="konto.html";
        return;
      }
      box.innerHTML="<div class=\"team-empty\">Nie udało się pobrać ekipy.</div>";
      return;
    }
    if(!Array.isArray(data.people)||!data.people.length){
      box.innerHTML="<div class=\"team-empty\"><strong>Na razie nikogo tu nie ma.</strong><br>Bądź pierwszą osobą zainteresowaną tym wyjazdem.</div>";
      return;
    }
    const people=data.people.slice(0,6);
    box.innerHTML="<div class=\"team-heading\"><strong>Osoby zainteresowane</strong><span>"+data.count+"</span></div>"+
      people.map(p=>{
        const safeId=escapeHtml(p.userId||"");
        const already=!!p.alreadyInterested;
        const isSelf=session.authenticated && p.userId===session.identity?.userId;
        const action=isSelf?"<span class=\"team-self\">To Ty</span>":
          (already?"<button type=\"button\" class=\"person-interest is-sent\" disabled>Zainteresowanie wysłane</button>":
          (safeId?"<button type=\"button\" class=\"person-interest\" data-interest-trip=\""+escapeHtml(trip)+"\" data-interest-user=\""+safeId+"\">Jestem zainteresowany</button>":""));
        return "<div class=\"person-mini\"><div><strong>"+escapeHtml(p.name||"Użytkownik")+"</strong><span>"+(p.age?escapeHtml(p.age+" lat"):"")+(p.city?" · "+escapeHtml(p.city):"")+"</span></div>"+action+"</div>";
      }).join("");
  }catch(error){
    console.error("Błąd pobierania ekipy:",error);
    box.innerHTML="<div class=\"team-empty\">Wystąpił błąd podczas pobierania ekipy.</div>";
  }
}
document.addEventListener("click",e=>{
  const teamButton=e.target.closest(".trip-team-action");
  if(teamButton){loadTripTeam(teamButton);return;}
  const interestButton=e.target.closest(".person-interest:not([disabled])");
  if(interestButton){
    sendTripInterest(
      interestButton,
      interestButton.dataset.interestTrip,
      interestButton.dataset.interestUser,
      interestButton.closest(".person-mini")?.querySelector("strong")?.textContent||""
    );
  }
});
