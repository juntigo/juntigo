/* PROPOSAL FORM MODAL */

#proposal-modal {
    position: fixed;
    inset: 0;
    z-index: 100001;
}

.proposal-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-y: auto;
    background: rgba(7, 27, 51, 0.72);
}

.proposal-modal-box {
    position: relative;
    width: 100%;
    max-width: 620px;
    max-height: calc(100vh - 48px);
    overflow-y: auto;
    padding: 36px;
    border-radius: 24px;
    background: var(--white);
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.25);
}

.proposal-close {
    position: absolute;
    top: 16px;
    right: 18px;
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 50%;
    background: #f1f3f5;
    color: var(--navy);
    font-size: 26px;
    line-height: 1;
    cursor: pointer;
}

.proposal-close:hover {
    background: var(--navy);
    color: var(--white);
}

.proposal-modal-tag {
    margin-bottom: 8px;
    color: var(--orange);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2px;
}

.proposal-modal-box h2 {
    margin: 0 0 8px;
    color: var(--navy);
    font-size: 32px;
}

.proposal-description {
    margin: 0 0 24px;
    color: var(--muted);
    line-height: 1.6;
}

.proposal-form {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.proposal-form-section {
    padding: 20px;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    background: #f8fafc;
}

.proposal-form-section-title {
    margin-bottom: 18px;
    color: var(--navy);
    font-size: 15px;
    font-weight: 800;
}

.proposal-form label {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
    color: var(--navy);
    font-size: 14px;
    font-weight: 700;
}

.proposal-form label:last-child {
    margin-bottom: 0;
}

.proposal-form input,
.proposal-form select,
.proposal-form textarea {
    width: 100%;
    min-height: 48px;
    padding: 14px 16px;
    border: 1px solid #d7dee8;
    border-radius: 12px;
    outline: none;
    background: var(--white);
    color: var(--navy);
    font: inherit;
    font-size: 15px;
}

.proposal-form textarea {
    min-height: 120px;
    resize: vertical;
}

.proposal-form input:focus,
.proposal-form select:focus,
.proposal-form textarea:focus {
    border-color: var(--orange);
    box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.12);
}

.proposal-form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.proposal-status {
    display: none;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
}

.proposal-status.is-visible {
    display: block;
}

.proposal-status--error {
    border: 1px solid #f3c2c2;
    background: #fff1f1;
    color: #9f1d1d;
}

.proposal-success {
    padding: 8px 0;
    text-align: center;
}

.proposal-success h2 {
    margin-bottom: 12px;
}

.proposal-success p {
    margin-bottom: 24px;
    color: var(--muted);
}

.proposal-submit,
.proposal-done,
.proposal-trigger,
.proposal-nav-trigger {
    font: inherit;
    cursor: pointer;
}

.proposal-submit,
.proposal-done {
    width: 100%;
    min-height: 54px;
    border: 0;
    border-radius: 999px;
    background: var(--orange);
    color: var(--white);
    font-size: 16px;
    font-weight: 800;
}

.proposal-submit:hover,
.proposal-done:hover {
    background: var(--navy);
}

.proposal-submit:disabled {
    cursor: wait;
    opacity: 0.7;
}

.proposal-trigger {
    border: 0;
}

.proposal-nav-trigger {
    padding: 0;
    border: 0;
    background: transparent;
}

@media (max-width: 600px) {
    .proposal-overlay {
        padding: 12px;
    }

    .proposal-modal-box {
        max-height: calc(100vh - 24px);
        padding: 28px 20px;
        border-radius: 20px;

    .proposal-modal-box h2 {

    }

    .proposal-form-section {
        padding: 16px;
    }

    .proposal-form-row {
        grid-template-columns: 1fr;
        gap: 0;
    }

    .proposal-form input,
    .proposal-form select,
    .proposal-form textarea {
        font-size: 16px;
    }
}

        [trip, 150, "Wyjazd"],
        [name, 100, "Imię lub pseudonim"],
        [instagram, 100, "Instagram"],
        [email, 254, "E-mail"],
        [city, 100, "Miasto"],
        [about, 2000, "Opis"]
    ];

    const tooLong = fieldLimits.find(([value, limit]) => value.length > limit);

        status.textContent = tooLong[2] + " jest za długie.";
        status.className = "join-status join-status--error is-visible";

    const formData = new URLSearchParams();

    formData.append("email", email);

    formData.append("about", about);
formData.append(
    "showProfile",

    status.className = "join-status";
    submitButton.disabled = true;
    submitButton.textContent = "Wysyłamy...";
    try {
        const response = await fetch(JUNTIGO_API, {
            method: "POST",
            body: formData
        });

        const data = await response.json();

       if (data.success) {
    showJoinSuccess(trip);
} else {

    status.textContent = "Nie udało się wysłać zgłoszenia. Spróbuj ponownie za chwilę.";

    submitButton.disabled = false;

}

    } catch (error) {

});

    document.body.style.overflow = "";

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function getInstagramUrl(value) {
  const handle = String(value || "").trim().replace(/^@+/, "");

  if (!/^[A-Za-z0-9._]{1,100}$/.test(handle)) {
    return "";
  }

  return "https://www.instagram.com/" + encodeURIComponent(handle) + "/";
}
  
async function saveInterest(event, trip, toUserId, toName) {
    if (event) event.preventDefault();

    const contactButton =
        event && event.currentTarget ? event.currentTarget : null;

    const sessionToken = getJuntigoSessionToken();

    if (!sessionToken) {
        window.location.href = "konto.html";
        return;
    }

    const normalizedTrip = String(trip || "").trim();
    const normalizedUserId = String(toUserId || "").trim();

    if (!normalizedTrip || !normalizedUserId) {
        console.error("Brak danych zainteresowania.", {
            trip: normalizedTrip,
            toUserId: normalizedUserId
        });
        return;
    }

    if (contactButton) {
        contactButton.disabled = true;
        contactButton.textContent = "Wysyłamy...";
    }

    try {
        const response = await fetch(JUNTIGO_API, {
            method: "POST",
            body: new URLSearchParams({
                type: "interest",
                sessionToken: sessionToken,
                trip: normalizedTrip,
                toUserId: normalizedUserId
            })
        });

        const data = await response.json();

        if (!data.success) {
            const errorMessage =
                data.error || "Nie udało się wysłać zainteresowania.";

            if (/sesj|zalog|token|uwierzyteln/i.test(errorMessage)) {
                clearJuntigoSession();
                window.location.href = "konto.html";
                return;
            }

            throw new Error(errorMessage);
        }

        if (contactButton) {
            contactButton.textContent = "Zainteresowanie wysłane";
            contactButton.classList.add("interest-sent");
        }
    } catch (error) {
        console.error("Błąd wysyłania zainteresowania:", error);

        if (contactButton) {
            contactButton.textContent = "Jestem zainteresowany";
            contactButton.disabled = false;
        }

        if (/sesj|zalog|token|uwierzyteln/i.test(error.message || "")) {
            clearJuntigoSession();
            window.location.href = "konto.html";
        }
    }
}

document.querySelectorAll(".view-switch button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");
const all=btn.dataset.view==="all";
cityBreakView.classList.toggle("hidden",all);allView.classList.toggle("hidden",!all);
if(all)renderAllTrips(filteredTrips());else if(typeFilter.value==="sport")renderSportGroups(filteredTrips());else renderCountryGroups(filteredTrips());
}));

document.addEventListener("click",event=>{const teamButton=event.target.closest(".trip-team-action");if(teamButton)loadTripTeam(teamButton);});

function showTripPersonProfile(person){
if(!person)return;
const old=document.getElementById("trip-person-profile-modal");if(old)old.remove();
const modal=document.createElement("div");modal.id="person-profile-modal";
modal.innerHTML='<div class="team-modal-overlay"></div><section class="team-modal-box person-profile-modal-box" role="dialog" aria-modal="true" aria-label="Profil użytkownika"><button type="button" class="team-modal-close" aria-label="Zamknij">×</button><div class="team-modal-tag">JUNTIGO</div><h2></h2><div class="person-profile-details"></div></section>';
modal.querySelector("h2").textContent=person.name||"Użytkownik Juntigo";
const details=modal.querySelector(".person-profile-details");
const lines=[person.age?(person.age+" lat"):"",person.city||"",person.verified?"✓ Profil uzupełniony":"",person.interests?("Zainteresowania: "+person.interests):"",person.travelStyle?("Styl podróżowania: "+person.travelStyle):"",person.instagram?("Instagram: "+person.instagram):"",person.about||""].filter(Boolean);
details.textContent=lines.join("\\n");
details.style.whiteSpace="pre-line";details.style.lineHeight="1.8";
const close=()=>modal.remove();modal.querySelector(".team-modal-overlay").addEventListener("click",close);modal.querySelector(".team-modal-close").addEventListener("click",close);document.body.appendChild(modal);
}
function closeTripTeamModal(){
const modal=document.getElementById("team-modal");
if(modal)modal.remove();
document.body.style.overflow="";
}
async function loadTripTeam(button){
const trip=button.dataset.trip;if(!trip)return;
const previous=document.getElementById("team-modal");if(previous)previous.remove();
const card=button.closest(".city-card,.trip-card");
const tripLabel=card&&card.querySelector("h3")?card.querySelector("h3").textContent.trim():trip;
const modal=document.createElement("div");modal.id="team-modal";
modal.innerHTML='<div class="team-modal-overlay" aria-hidden="true"></div><section class="team-modal-box" role="dialog" aria-modal="true" aria-label="Ekipa na wyjazd"><button type="button" class="team-modal-close" aria-label="Zamknij">×</button><div class="team-modal-tag">JUNTIGO</div><h2>Ekipa na wyjazd</h2><p class="team-modal-trip-name"></p><div class="team-modal-content"><div class="team-results"><div class="team-empty">Szukamy ekipy...</div></div></div></section>';
modal.querySelector(".team-modal-trip-name").textContent=tripLabel;
modal.querySelector(".team-modal-overlay").addEventListener("click",closeTripTeamModal);
modal.querySelector(".team-modal-close").addEventListener("click",closeTripTeamModal);
document.addEventListener("keydown",function esc(event){if(event.key==="Escape"&&document.getElementById("team-modal")===modal){closeTripTeamModal();document.removeEventListener("keydown",esc);}});
document.body.appendChild(modal);document.body.style.overflow="hidden";
const results=modal.querySelector(".team-results");
try{
const session=await validateJuntigoSession();const token=session.authenticated?getJuntigoSessionToken():"";
const response=await fetch(JUNTIGO_API+"?trip="+encodeURIComponent(trip)+(token?"&sessionToken="+encodeURIComponent(token):""));
const data=await response.json();
if(document.getElementById("team-modal")!==modal)return;
if(!data.success){results.innerHTML='<div class="team-empty">Nie udało się pobrać danych ekipy. Spróbuj ponownie.</div>';return;}
const people=Array.isArray(data.people)?data.people.filter(p=>p&&typeof p==="object"):[];
if(!people.length){results.innerHTML='<div class="team-empty"><strong>Na razie nikogo tu nie ma.</strong><span>Bądź pierwszą osobą zainteresowaną tym wyjazdem.</span></div>';return;}
window.juntigoTeamPeople=people;
results.innerHTML='<div class="team-heading"><strong>Osoby zainteresowane</strong><span>'+escapeHtml(String(Number(data.count)||people.length))+'</span></div>'+people.map((p,index)=>'<article class="person-card"><h4>'+escapeHtml(p.name||"Użytkownik Juntigo")+'</h4><div class="person-meta">'+(p.age?escapeHtml(String(p.age))+' lat':'')+(p.city?' · '+escapeHtml(p.city):'')+'</div>'+(p.verified?'<div class="person-profile-verified">✓ Profil uzupełniony</div>':'')+(p.interests?'<div class="person-interests">'+escapeHtml(p.interests)+'</div>':'')+(p.travelStyle?'<div class="person-interests">Styl: '+escapeHtml(p.travelStyle)+'</div>':'')+(p.about?'<p class="person-about">„'+escapeHtml(p.about)+'”</p>':'')+(p.instagram?'<a class="person-instagram" target="_blank" rel="noopener noreferrer" href="'+getInstagramUrl(p.instagram)+'">'+escapeHtml(p.instagram)+'</a>':'')+(p.userId?'<div class="person-card-actions"><button type="button" class="person-profile-button" data-person-index="'+index+'">Zobacz profil</button><button type="button" class="person-contact" data-person-index="'+index+'" data-trip="'+escapeHtml(trip)+'" data-user-id="'+escapeHtml(p.userId)+'" data-user-name="'+escapeHtml(p.name||"Użytkownik Juntigo")+'" '+(p.alreadyInterested?'disabled':'')+'>'+(p.alreadyInterested?'Zainteresowanie wysłane':'Jestem zainteresowany')+'</button></div>':'')+'</article>').join("");
results.querySelectorAll(".person-profile-button").forEach(b=>b.addEventListener("click",()=>showTripPersonProfile(window.juntigoTeamPeople[Number(b.dataset.personIndex)])));
results.querySelectorAll(".person-contact").forEach(b=>b.addEventListener("click",event=>saveInterest(event,b.dataset.trip,b.dataset.userId,b.dataset.userName)));
}catch(error){if(document.getElementById("team-modal")===modal){console.error(error);results.innerHTML='<div class="team-empty">Wystąpił błąd podczas pobierania ekipy.</div>';}}
}

render();</script>
</body>
</html>
