/* PROPOSAL FORM MODAL */

#proposal-modal {
    position: fixed;
    inset: 0;
    z-index: 100001;
}

.proposal-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-y: auto;
    background: rgba(7, 27, 51, 0.72);
}

.proposal-modal-box {
    position: relative;
    width: 100%;
    max-width: 620px;
    max-height: calc(100vh - 48px);
    overflow-y: auto;
    padding: 36px;
    border-radius: 24px;
    background: var(--white);
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.25);
}

.proposal-close {
    position: absolute;
    top: 16px;
    right: 18px;
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 50%;
    background: #f1f3f5;
    color: var(--navy);
    font-size: 26px;
    line-height: 1;
    cursor: pointer;
}

.proposal-close:hover {
    background: var(--navy);
    color: var(--white);
}

.proposal-modal-tag {
    margin-bottom: 8px;
    color: var(--orange);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2px;
}

.proposal-modal-box h2 {
    margin: 0 0 8px;
    color: var(--navy);
    font-size: 32px;
}

.proposal-description {
    margin: 0 0 24px;
    color: var(--muted);
    line-height: 1.6;
}

.proposal-form {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.proposal-form-section {
    padding: 20px;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    background: #f8fafc;
}

.proposal-form-section-title {
    margin-bottom: 18px;
    color: var(--navy);
    font-size: 15px;
    font-weight: 800;
}

.proposal-form label {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
    color: var(--navy);
    font-size: 14px;
    font-weight: 700;
}

.proposal-form label:last-child {
    margin-bottom: 0;
}

.proposal-form input,
.proposal-form select,
.proposal-form textarea {
    width: 100%;
    min-height: 48px;
    padding: 14px 16px;
    border: 1px solid #d7dee8;
    border-radius: 12px;
    outline: none;
    background: var(--white);
    color: var(--navy);
    font: inherit;
    font-size: 15px;
}

.proposal-form textarea {
    min-height: 120px;
    resize: vertical;
}

.proposal-form input:focus,
.proposal-form select:focus,
.proposal-form textarea:focus {
    border-color: var(--orange);
    box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.12);
}

.proposal-form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.proposal-status {
    display: none;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
}

.proposal-status.is-visible {
    display: block;
}

.proposal-status--error {
    border: 1px solid #f3c2c2;
    background: #fff1f1;
    color: #9f1d1d;
}

.proposal-success {
    padding: 8px 0;
    text-align: center;
}

.proposal-success h2 {
    margin-bottom: 12px;
}

.proposal-success p {
    margin-bottom: 24px;
    color: var(--muted);
}

.proposal-submit,
.proposal-done,
.proposal-trigger,
.proposal-nav-trigger {
    font: inherit;
    cursor: pointer;
}

.proposal-submit,
.proposal-done {
    width: 100%;
    min-height: 54px;
    border: 0;
    border-radius: 999px;
    background: var(--orange);
    color: var(--white);
    font-size: 16px;
    font-weight: 800;
}

.proposal-submit:hover,
.proposal-done:hover {
    background: var(--navy);
}

.proposal-submit:disabled {
    cursor: wait;
    opacity: 0.7;
}

.proposal-trigger {
    border: 0;
}

.proposal-nav-trigger {
    padding: 0;
    border: 0;
    background: transparent;
}

@media (max-width: 600px) {
    .proposal-overlay {
        padding: 12px;
    }

    .proposal-modal-box {
        max-height: calc(100vh - 24px);
        padding: 28px 20px;
        border-radius: 20px;
    }

    .proposal-modal-box h2 {
        font-size: 26px;
    }

    .proposal-form-section {
        padding: 16px;
    }

    .proposal-form-row {
        grid-template-columns: 1fr;
        gap: 0;
    }

    .proposal-form input,
    .proposal-form select,
    .proposal-form textarea {
        font-size: 16px;
    }
}

    const email = document.getElementById("join-email").value.trim();

        [trip, 150, "Wyjazd"],
        [name, 100, "Imię lub pseudonim"],
        [instagram, 100, "Instagram"],
        [email, 254, "E-mail"],
        [city, 100, "Miasto"],
        [about, 2000, "Opis"]
    ];

    const tooLong = fieldLimits.find(([value, limit]) => value.length > limit);

    formData.append("trip", trip);
    formData.append("name", name);
    formData.append("instagram", instagram);
    formData.append("email", email);

    formData.append("city", city);
    formData.append("about", about);
formData.append(
    "showProfile",
    document.getElementById("join-show-profile").checked ? "Tak" : "Nie"

    status.className = "join-status";
    submitButton.disabled = true;
    submitButton.textContent = "Wysyłamy...";
    try {
        const response = await fetch(JUNTIGO_API, {
            method: "POST",
            body: formData
        });

        const data = await response.json();

       if (data.success) {
    showJoinSuccess(trip);
} else {

    status.textContent = "Nie udało się wysłać zgłoszenia. Spróbuj ponownie za chwilę.";

    submitButton.textContent = "Zgłoś zainteresowanie";
}

document.addEventListener("click", function(event) {

});
function closeJoinForm() {
    const modal = document.getElementById("join-modal");

    if (modal) {
        modal.remove();
    }

    document.body.style.overflow = "";
}
function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function getInstagramUrl(value) {
  const handle = String(value || "").trim().replace(/^@+/, "");

  if (!/^[A-Za-z0-9._]{1,100}$/.test(handle)) {
    return "";
  }

  return "https://www.instagram.com/" + encodeURIComponent(handle) + "/";
}
  
async function saveInterest(event, trip, toUserId, toName) {
    if (event) event.preventDefault();

    const contactButton =
        event && event.currentTarget ? event.currentTarget : null;

    const sessionToken = getJuntigoSessionToken();

    if (!sessionToken) {
        window.location.href = "konto.html";
        return;
    }

    const normalizedTrip = String(trip || "").trim();
    const normalizedUserId = String(toUserId || "").trim();

    if (!normalizedTrip || !normalizedUserId) {
        console.error("Brak danych zainteresowania.", {
            trip: normalizedTrip,
            toUserId: normalizedUserId
        });
        return;
    }

    if (contactButton) {
        contactButton.disabled = true;
        contactButton.textContent = "Wysyłamy...";
    }

    try {
        const response = await fetch(JUNTIGO_API, {
            method: "POST",
            body: new URLSearchParams({
                type: "interest",
                sessionToken: sessionToken,
                trip: normalizedTrip,
                toUserId: normalizedUserId
            })
        });

        const data = await response.json();

        if (!data.success) {
            const errorMessage =
                data.error || "Nie udało się wysłać zainteresowania.";

            if (/sesj|zalog|token|uwierzyteln/i.test(errorMessage)) {
                clearJuntigoSession();
                window.location.href = "konto.html";
                return;
            }

            throw new Error(errorMessage);
        }

        if (contactButton) {
            contactButton.textContent = "Zainteresowanie wysłane";
            contactButton.classList.add("interest-sent");
        }
    } catch (error) {
        console.error("Błąd wysyłania zainteresowania:", error);

        if (contactButton) {
            contactButton.textContent = "Jestem zainteresowany";
            contactButton.disabled = false;
        }

        if (/sesj|zalog|token|uwierzyteln/i.test(error.message || "")) {
            clearJuntigoSession();
            window.location.href = "konto.html";
        }
    }
}

 labels.forEach(item=>{
   const chip=document.createElement("span");
   chip.className="filter-chip";
   chip.innerHTML=escapeHtml(item.label)+' <button type="button" aria-label="Usuń filtr '+escapeHtml(item.label)+'">×</button>';
   chip.querySelector("button").addEventListener("click",()=>{item.select.value="all";render();});
   activeFilters.appendChild(chip);
 });
 if(labels.length){
   const clear=document.createElement("button");
   clear.type="button";clear.className="clear-filters";clear.textContent="Wyczyść filtry";
   clear.addEventListener("click",()=>{monthFilter.value="all";typeFilter.value="all";directionFilter.value="all";render();});
   activeFilters.appendChild(clear);
 }
 resultCount.textContent=trips.length+" "+(trips.length===1?"wyjazd":(trips.length<5?"wyjazdy":"wyjazdów"));
 calendarView.replaceChildren();allView.replaceChildren();
 const grouped=new Map();
 MONTHS.forEach(([y,m,label])=>grouped.set(y+"-"+m,{year:y,month:m,label,trips:[]}));
 trips.forEach(t=>{const key=t.year+"-"+t.month;if(!grouped.has(key))grouped.set(key,{year:t.year,month:t.month,label:key,trips:[]});grouped.get(key).trips.push(t)});
 for(const group of grouped.values()){
   if(!group.trips.length) continue;
   const section=document.createElement("section");section.className="month-section";
   section.innerHTML='<div class="month-heading"><h2>'+group.label+'</h2><span>'+group.trips.length+' '+(group.trips.length===1?"wyjazd":group.trips.length<5?"wyjazdy":"wyjazdów")+'</span></div>';
   const grid=document.createElement("div");grid.className="trip-grid";group.trips.forEach(t=>grid.appendChild(card(t)));section.appendChild(grid);calendarView.appendChild(section);
 }
 if(!calendarView.children.length){
   calendarView.innerHTML='<div class="empty"><strong>Nie znaleźliśmy jeszcze wyjazdów spełniających te kryteria.</strong>Spróbuj zmienić filtry.</div>';
 }
 if(trips.length){
   const grid=document.createElement("div");grid.className="trip-grid";trips.forEach(t=>grid.appendChild(card(t)));allView.appendChild(grid);
 }else{
   allView.innerHTML='<div class="empty"><strong>Nie znaleźliśmy jeszcze wyjazdów spełniających te kryteria.</strong>Spróbuj zmienić filtry.</div>';
 }
}
document.querySelectorAll(".view-switch button").forEach(btn=>btn.addEventListener("click",()=>{
 document.querySelectorAll(".view-switch button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");
 const isCalendar=btn.dataset.view==="calendar";calendarView.classList.toggle("hidden",!isCalendar);allView.classList.toggle("hidden",isCalendar);
}));
[monthFilter,typeFilter,directionFilter].forEach(el=>el.addEventListener("change",render));
render();

async function sendTripInterest(button, trip, toUserId, personName){
  button.disabled=true;
  button.textContent="Zapisywanie...";
  try{
    const session=await validateJuntigoSession();
    if(!session.authenticated){
      window.location.href="konto.html";
      return;
    }
    const body=new URLSearchParams();
    body.append("type","interest");
    body.append("sessionToken",getJuntigoSessionToken());
    body.append("trip",trip);
    body.append("toUserId",toUserId);
    const response=await fetch(JUNTIGO_API,{method:"POST",body});
    const data=await response.json();
    if(!data.success){
      if(data.sessionInvalid){
        clearJuntigoSession();
        window.location.href="konto.html";
        return;
      }
      button.disabled=false;
      button.textContent=data.error||"Spróbuj ponownie";
      return;
    }
    if(data.match===true){
      button.classList.add("is-match");
      button.textContent="Match";
      button.disabled=true;
      setTimeout(()=>{window.location.href="konto.html";},900);
      return;
    }
    button.classList.add("is-sent");
    button.textContent="Zainteresowanie wysłane";
    button.disabled=true;
  }catch(error){
    console.error("Błąd zainteresowania:",error);
    button.disabled=false;
    button.textContent="Spróbuj ponownie";
  }
}

async function loadTripTeam(button){
  const trip=button.dataset.trip;
  const card=button.closest(".trip-card");
  let box=card.querySelector(".team-results");
  if(box){box.remove();button.textContent="Zobacz ekipę";return;}
  box=document.createElement("div");
  box.className="team-results";
  box.innerHTML="<div class=\"team-empty\">Szukamy ekipy...</div>";
  card.querySelector(".trip-content").appendChild(box);
  button.textContent="Ukryj ekipę";
  try{
    const session=await validateJuntigoSession();
    const token=session.authenticated?getJuntigoSessionToken():"";
    const url=JUNTIGO_API+"?trip="+encodeURIComponent(trip)+(token?"&sessionToken="+encodeURIComponent(token):"");
    const response=await fetch(url);
    const data=await response.json();
    if(!data.success){
      if(data.sessionInvalid){
        clearJuntigoSession();
        window.location.href="konto.html";
        return;
      }
      box.innerHTML="<div class=\"team-empty\">Nie udało się pobrać ekipy.</div>";
      return;
    }
    if(!Array.isArray(data.people)||!data.people.length){
      box.innerHTML="<div class=\"team-empty\"><strong>Na razie nikogo tu nie ma.</strong><br>Bądź pierwszą osobą zainteresowaną tym wyjazdem.</div>";
      return;
    }
    const people=data.people.slice(0,6);
    box.innerHTML="<div class=\"team-heading\"><strong>Osoby zainteresowane</strong><span>"+data.count+"</span></div>"+
      people.map(p=>{
        const safeId=escapeHtml(p.userId||"");
        const already=!!p.alreadyInterested;
        const isSelf=session.authenticated && p.userId===session.identity?.userId;
        const action=isSelf?"<span class=\"team-self\">To Ty</span>":
          (already?"<button type=\"button\" class=\"person-interest is-sent\" disabled>Zainteresowanie wysłane</button>":
          (safeId?"<button type=\"button\" class=\"person-interest\" data-interest-trip=\""+escapeHtml(trip)+"\" data-interest-user=\""+safeId+"\">Jestem zainteresowany</button>":""));
        return "<div class=\"person-mini\"><div><strong>"+escapeHtml(p.name||"Użytkownik")+"</strong><span>"+(p.age?escapeHtml(p.age+" lat"):"")+(p.city?" · "+escapeHtml(p.city):"")+"</span></div>"+action+"</div>";
      }).join("");
  }catch(error){
    console.error("Błąd pobierania ekipy:",error);
    box.innerHTML="<div class=\"team-empty\">Wystąpił błąd podczas pobierania ekipy.</div>";
  }
}
document.addEventListener("click",e=>{
  const teamButton=e.target.closest(".trip-team-action");
  if(teamButton){loadTripTeam(teamButton);return;}
  const interestButton=e.target.closest(".person-interest:not([disabled])");
  if(interestButton){
    sendTripInterest(
      interestButton,
      interestButton.dataset.interestTrip,
      interestButton.dataset.interestUser,
      interestButton.closest(".person-mini")?.querySelector("strong")?.textContent||""
    );
  }
});
